name: Publish Android tester update
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'version.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'scripts/*update*'
      - 'scripts/android-signing-cert.sha256'
      - '.github/workflows/android-update.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duitaing-android-updates
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'agungrmdniiii/cashflow-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      DUITAING_SIGNING_KEYSTORE: ${{ github.workspace }}/app/build/tester-signing.keystore
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Choose update version
        id: version
        run: python3 scripts/next_update_version.py
      - name: Restore the existing tester signing key
        env:
          KEYSTORE_B64: ${{ secrets.DUITAING_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            printf '%s\n' 'Missing DUITAING_DEBUG_KEYSTORE_BASE64. Configure the existing tester key before publishing.' >&2
            exit 1
          fi
          mkdir -p "$(dirname "$DUITAING_SIGNING_KEYSTORE")"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$DUITAING_SIGNING_KEYSTORE"
          chmod 600 "$DUITAING_SIGNING_KEYSTORE"
      - name: Test and build optimized APK
        env:
          UPDATE_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -PoptimizedReview=true -PappVersionCode="$UPDATE_CODE" --console=plain
          python3 -m unittest discover -s scripts -p 'test_update_release.py'
      - name: Verify signing certificate and prepare release metadata
        env:
          UPDATE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          actual=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p')
          expected=$(tr -d '\r\n' < scripts/android-signing-cert.sha256)
          test "$actual" = "$expected" || { printf 'Signing certificate mismatch. Expected: %s Actual: %s\n' "$expected" "$actual" >&2; exit 1; }
          python3 scripts/update_release.py --apk app/build/outputs/apk/debug/app-debug.apk --build-metadata app/build/outputs/apk/debug/output-metadata.json --notes-file app/src/main/res/raw/release_notes.txt --tag "$UPDATE_TAG" --output-dir app/build/update-release
      - name: Publish APK and update information atomically
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_TAG: ${{ steps.version.outputs.tag }}
          UPDATE_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "$UPDATE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft.txt"; then
            test "$(cat "$RUNNER_TEMP/release-is-draft.txt")" = true || { printf '%s\n' 'Refusing to overwrite a published release.' >&2; exit 1; }
            gh release delete-asset "$UPDATE_TAG" DuitAing.apk --yes || true
          else
            gh release create "$UPDATE_TAG" --draft --target "$GITHUB_SHA" --title "Duit Aing $UPDATE_NAME" --notes-file app/build/update-release/release-notes.txt
          fi
          gh release upload "$UPDATE_TAG" app/build/outputs/apk/debug/app-debug.apk app/build/update-release/update.json --clobber
          asset_url=$(gh release view "$UPDATE_TAG" --json assets --jq '.assets[] | select(.name == "app-debug.apk") | .apiUrl')
          test -n "$asset_url"
          gh api --method PATCH "$asset_url" -f name=DuitAing.apk > /dev/null
          gh release edit "$UPDATE_TAG" --draft=false --latest
      - name: Remove signing material
        if: always()
        run: rm -f "$DUITAING_SIGNING_KEYSTORE"
